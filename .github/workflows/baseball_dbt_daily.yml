name: baseball-dbt-daily

# Rebuilds silver/gold (and runs all tests) after the 6 AM Denver Lambda pull.
# 14:17 UTC = 8:17 AM Denver in summer, 7:17 AM in winter; minute 17 avoids top-of-hour scheduler delays.
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-dbt
  cancel-in-progress: false

defaults:
  run:
    working-directory: 05-baseball-scouting-reports/dbt_project

jobs:
  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BASEBALL_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BASEBALL_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.BASEBALL_AWS_REGION }}
      S3_BUCKET: ${{ secrets.BASEBALL_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 05-baseball-scouting-reports/requirements.txt
      - run: pip install -r ../requirements.txt
      - name: dbt build (silver + gold + all tests)
        run: dbt build
