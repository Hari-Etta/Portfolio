name: baseball-model-train

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-model-train
  cancel-in-progress: false

defaults:
  run:
    working-directory: 05-baseball-scouting-reports

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BASEBALL_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BASEBALL_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.BASEBALL_AWS_REGION }}
      S3_BUCKET: ${{ secrets.BASEBALL_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 05-baseball-scouting-reports/requirements.txt
      - run: pip install -r requirements.txt

      - name: dbt build (all tables + tests, incl. leakage guards)
        working-directory: 05-baseball-scouting-reports/dbt_project
        run: dbt build --exclude gold_pitcher_whiff_over_expected

      - name: Rolling evaluation (model card)
        run: python -m src.model.eval_rolling --set baseline

      - name: September test metrics and calibration
        run: python -m src.model.train_whiff

      - name: Train final model on full season and upload to S3
        run: python -m src.model.train_final

      - name: Cross-fitted expected whiffs to S3
        run: python -m src.model.score_crossfit

      - name: Rebuild whiffs-over-expected from fresh scores
        working-directory: 05-baseball-scouting-reports/dbt_project
        run: dbt build --select gold_pitcher_whiff_over_expected
