name: baseball-statcast-backfill

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: true
      end:
        description: "End date (YYYY-MM-DD)"
        required: true
      season:
        description: "Season (e.g. 2026)"
        required: true

defaults:
  run:
    working-directory: 05-baseball-scouting-reports

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BASEBALL_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BASEBALL_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.BASEBALL_AWS_REGION }}
      S3_BUCKET: ${{ secrets.BASEBALL_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 05-baseball-scouting-reports/requirements.txt
      - run: pip install -r requirements.txt
      - name: Backfill Statcast to S3
        run: python -m src.ingest.statcast_backfill --start "${{ inputs.start }}" --end "${{ inputs.end }}" --season "${{ inputs.season }}"
      - name: Pull teams, rosters, transactions to S3
        run: python -m src.ingest.mlb_api --season "${{ inputs.season }}" --tx-start "${{ inputs.start }}" --tx-end "${{ inputs.end }}"
      - name: Data-quality report
        run: python -m src.quality.check_statcast
