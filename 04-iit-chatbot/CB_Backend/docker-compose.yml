# Local Postgres + pgvector, same extension Neon uses.  docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: iit-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iit_chatbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
