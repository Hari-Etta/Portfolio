version: 2

models:
  - name: silver_pitches
    description: "One clean, typed row per 2026 regular-season pitch."
    columns:
      - name: pitch_id
        description: "game_pk-at_bat_number-pitch_number; must be unique."
        data_tests: [unique, not_null]
      - name: game_pk
        data_tests: [not_null]
      - name: game_date
        data_tests: [not_null]
      - name: pitcher_id
        data_tests: [not_null]
      - name: batter_id
        data_tests: [not_null]
      - name: game_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['R']
      - name: balls
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
      - name: strikes
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2]
                quote: false
