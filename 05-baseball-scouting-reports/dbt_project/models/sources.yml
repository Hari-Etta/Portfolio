version: 2

sources:
  - name: bronze
    tables:
      - name: statcast
        meta:
          external_location: "read_parquet('s3://{{ env_var('S3_BUCKET') }}/bronze/statcast/season=*/*.parquet', union_by_name=true, hive_partitioning=true)"
      - name: people
        meta:
          external_location: "read_parquet('s3://{{ env_var('S3_BUCKET') }}/bronze/mlb/people/season=*/*.parquet', union_by_name=true, hive_partitioning=true)"
      - name: transactions
        meta:
          external_location: "read_parquet('s3://{{ env_var('S3_BUCKET') }}/bronze/mlb/transactions/pulled=*/*.parquet', union_by_name=true, hive_partitioning=true)"

  - name: ml
    description: "Outputs written by the Python model code (src/model)."
    tables:
      - name: whiff_scores
        description: "Cross-fitted expected whiff probability (xwhiff) per swing, from score_crossfit.py."
        meta:
          external_location: "read_parquet('s3://{{ env_var('S3_BUCKET') }}/ml/whiff_scores.parquet')"
